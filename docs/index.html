<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Check-In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1 id="title">Class Check-In</h1>
  <p class="sub" id="subtitle">Loading.</p>

  <form id="form" autocomplete="off">
    <label for="studentId">Student ID number</label>
    <input id="studentId" type="tel" inputmode="numeric" pattern="[0-9]*"
           placeholder="e.g. 11032915" required>

    <label for="code">Code on the screen</label>
    <input id="code" class="code-input" type="tel" inputmode="numeric"
           pattern="[0-9]*" maxlength="6" placeholder="000000" required>

    <button id="submit" type="submit">Mark me present</button>
  </form>

  <div id="msg" class="msg hidden"></div>

  <p class="note">
    Your ID is saved on this phone so you only type it once.
    <a href="#" id="forget">Forget my ID</a>
  </p>
</div>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.ATTENDANCE_CONFIG;
  var params = new URLSearchParams(location.search);
  // Keep this the same as STUDENT_ID_DIGITS in Code.gs.
  var ID_DIGITS = 8;
  var classId = (params.get('c') || '').trim().toUpperCase();

  var elForm = document.getElementById('form');
  var elId = document.getElementById('studentId');
  var elCode = document.getElementById('code');
  var elSubmit = document.getElementById('submit');
  var elMsg = document.getElementById('msg');

  function show(kind, big, detail) {
    elMsg.className = 'msg ' + kind;
    elMsg.innerHTML = '';
    var b = document.createElement('span');
    b.className = 'big';
    b.textContent = big;
    elMsg.appendChild(b);
    if (detail) elMsg.appendChild(document.createTextNode(detail));
  }

  // A random per-browser id. It is not a login and it is not tied to a person.
  // It only lets the instructor spot one phone checking in several students.
  function deviceId() {
    var d = localStorage.getItem('attendance.device');
    if (!d) {
      d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 18);
      localStorage.setItem('attendance.device', d);
    }
    return d;
  }

  var meta = cfg.classes[classId];
  document.getElementById('title').textContent = meta ? meta.label : 'Class Check-In';
  document.getElementById('subtitle').textContent = meta
    ? meta.meets + '. Enter the code showing on the screen.'
    : 'This link is missing its class. Scan the QR code on the screen instead.';

  if (!meta) elForm.classList.add('hidden');

  // The saved ID is per class, so a student in two of your courses is not
  // forced to retype, and a shared tablet does not carry one ID everywhere.
  var idKey = 'attendance.studentId';

  var saved = localStorage.getItem(idKey);
  if (saved) {
    elId.value = saved;
    setTimeout(function () { elCode.focus(); }, 50);
  }

  document.getElementById('forget').addEventListener('click', function (e) {
    e.preventDefault();
    localStorage.removeItem(idKey);
    elId.value = '';
    elId.focus();
    show('warn', 'ID cleared', 'Type your student ID again next time.');
  });

  elForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var studentId = elId.value.replace(/\D/g, '');
    var code = elCode.value.replace(/\D/g, '');

    // Caught here as well as on the server, so a typo never leaves the phone.
    if (studentId.length !== ID_DIGITS) {
      show('bad', 'Check your ID',
           'A student ID has ' + ID_DIGITS + ' digits. You entered ' + studentId.length + '.');
      return;
    }
    if (code.length !== 6) { show('bad', 'Six digits', 'The code on the screen has six digits.'); return; }

    elSubmit.disabled = true;
    elSubmit.textContent = 'Sending.';
    show('warn', 'Sending.', '');

    fetch(cfg.apiUrl, {
      method: 'POST',
      // text/plain keeps this a simple request, so the browser skips the
      // preflight that Apps Script cannot answer.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'checkin',
        classId: classId,
        studentId: studentId,
        code: code,
        device: deviceId()
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) {
        show('bad', 'Not counted', res.error || 'Something went wrong. Try again.');
        return;
      }
      localStorage.setItem(idKey, studentId);
      elCode.value = '';
      if (res.already) {
        show('warn', 'Already counted',
             (res.name ? res.name + ' is' : 'You are') + ' already marked present today.');
      } else if (res.status === 'pending') {
        // Add and drop period. The row is saved, but the roster has not caught up.
        show('warn', 'Recorded', res.message);
      } else {
        show('ok', 'Present', res.name + ', you are marked present for today.');
      }
    })
    .catch(function () {
      show('bad', 'No connection', 'The check-in did not reach the server. Check your signal and try again.');
    })
    .then(function () {
      elSubmit.disabled = false;
      elSubmit.textContent = 'Mark me present';
    });
  });
})();
</script>
</body>
</html>
